<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Support Ujjwal Pandey by buying a coffee."
    >

    <meta
        name="theme-color"
        content="#050608"
    >

    <title>Buy Me a Coffee | Ujjwal Pandey</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Razorpay Checkout -->

    <script
        src="https://checkout.razorpay.com/v1/checkout.js"
    ></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #050608;

            color: #f4f7fb;

            font-family: "Inter", sans-serif;

            overflow-x: hidden;

        }


        /* =========================
           BACKGROUND GRID
        ========================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -2;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

        }


        /* =========================
           BACKGROUND GLOW
        ========================== */

        body::after {

            content: "";

            position: fixed;

            width: 450px;

            height: 450px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            background:
                rgba(0,255,156,0.055);

            filter: blur(110px);

            border-radius: 50%;

            z-index: -1;

        }


        /* =========================
           CARD
        ========================== */

        .coffee-card {

            width: min(100%, 620px);

            padding: 45px 35px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            border-radius: 20px;

            background:
                rgba(9,12,17,0.92);

            backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.45);

            text-align: center;

        }


        /* =========================
           TERMINAL
        ========================== */

        .terminal {

            margin-bottom: 25px;

            color: #00ff9c;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.7rem;

        }


        .terminal span {

            color: #687180;

        }


        /* =========================
           ICON
        ========================== */

        .coffee-icon {

            width: 75px;

            height: 75px;

            margin:
                0 auto 22px;

            display: grid;

            place-items: center;

            border:
                1px solid
                rgba(0,255,156,0.25);

            border-radius: 16px;

            color: #00ff9c;

            background:
                rgba(0,255,156,0.05);

            font-size: 1.7rem;

            box-shadow:
                0 0 35px
                rgba(0,255,156,0.08);

        }


        /* =========================
           HEADING
        ========================== */

        h1 {

            margin-bottom: 12px;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size:
                clamp(
                    2rem,
                    7vw,
                    3.2rem
                );

            letter-spacing:
                -0.05em;

        }


        h1 span {

            color: #00ff9c;

        }


        /* =========================
           DESCRIPTION
        ========================== */

        .description {

            max-width: 470px;

            margin:
                0 auto 25px;

            color: #8b94a3;

            font-size: 0.86rem;

            line-height: 1.8;

        }


        /* =========================
           USER
        ========================== */

        .user {

            margin-bottom: 28px;

            color: #626b79;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.63rem;

        }


        .user strong {

            color: #00d9ff;

            font-weight: 500;

        }


        /* =========================
           AMOUNT TITLE
        ========================== */

        .amount-title {

            margin-bottom: 12px;

            color: #737c89;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.62rem;

            text-align: left;

        }


        /* =========================
           AMOUNT GRID
        ========================== */

        .amount-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;

            margin-bottom: 12px;

        }


        .amount-btn {

            min-height: 48px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 8px;

            background:
                rgba(255,255,255,0.025);

            color: #aab2bf;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.68rem;

            cursor: pointer;

            transition:
                border-color .25s ease,
                color .25s ease,
                background .25s ease;

        }


        .amount-btn:hover {

            border-color:
                rgba(0,255,156,0.3);

            color: #00ff9c;

        }


        .amount-btn.active {

            border-color:
                rgba(0,255,156,0.6);

            background:
                rgba(0,255,156,0.08);

            color: #00ff9c;

            box-shadow:
                0 0 20px
                rgba(0,255,156,0.05);

        }


        /* =========================
           CUSTOM AMOUNT
        ========================== */

        .custom-amount {

            width: 100%;

            height: 50px;

            margin-bottom: 18px;

            padding: 0 14px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 8px;

            outline: none;

            background:
                rgba(0,0,0,0.2);

            color: white;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.7rem;

            transition: .25s ease;

        }


        .custom-amount::placeholder {

            color: #4d5663;

        }


        .custom-amount:focus {

            border-color:
                rgba(0,255,156,0.45);

            box-shadow:
                0 0 0 3px
                rgba(0,255,156,0.04);

        }


        /* =========================
           PAYMENT BUTTON
        ========================== */

        .pay-button {

            width: 100%;

            min-height: 54px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border: 0;

            border-radius: 9px;

            background: #00ff9c;

            color: #020604;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.72rem;

            font-weight: 700;

            cursor: pointer;

            transition: .3s ease;

            box-shadow:
                0 12px 30px
                rgba(0,255,156,0.12);

        }


        .pay-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 40px
                rgba(0,255,156,0.22);

        }


        .pay-button:active {

            transform:
                translateY(0);

        }


        .pay-button:disabled {

            opacity: .55;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           STATUS
        ========================== */

        #payment-status {

            min-height: 20px;

            margin-top: 15px;

            color: #687180;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: .6rem;

            line-height: 1.6;

        }


        #payment-status.success {

            color: #00ff9c;

        }


        #payment-status.error {

            color: #ff7777;

        }


        /* =========================
           SECURITY
        ========================== */

        .security-note {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: #505966;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: .52rem;

        }


        .security-note i {

            color: #00ff9c;

        }


        /* =========================
           BACK LINK
        ========================== */

        .back-link {

            display: inline-block;

            margin-top: 24px;

            color: #596271;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: .6rem;

            text-decoration: none;

            transition: .25s ease;

        }


        .back-link:hover {

            color: #00ff9c;

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            body {

                padding: 12px;

            }


            .coffee-card {

                padding:
                    35px 20px;

                border-radius: 16px;

            }


            .amount-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .coffee-icon {

                width: 65px;

                height: 65px;

                font-size: 1.45rem;

            }


            .description {

                font-size: .8rem;

            }


            .pay-button {

                min-height: 56px;

            }

        }

    </style>

</head>


<body>


    <main class="coffee-card">


        <!-- Terminal -->

        <div class="terminal">

            <span>$</span>
            ./support --ujjwal

        </div>


        <!-- Coffee Icon -->

        <div class="coffee-icon">

            <i class="fa-solid fa-mug-hot"></i>

        </div>


        <!-- Heading -->

        <h1>

            Buy Me a
            <span>Coffee</span>

        </h1>


        <!-- Description -->

        <p class="description">

            If you find my projects, learning resources
            or open-source work useful, you can support
            my work with a small contribution.

        </p>


        <!-- Developer -->

        <div class="user">

            developer:

            <strong>ujjwal</strong>

        </div>


        <!-- Amount -->

        <div class="amount-title">

            select_amount

        </div>


        <div class="amount-grid">


            <button
                type="button"
                class="amount-btn active"
                data-amount="50"
            >
                ₹50
            </button>


            <button
                type="button"
                class="amount-btn"
                data-amount="100"
            >
                ₹100
            </button>


            <button
                type="button"
                class="amount-btn"
                data-amount="200"
            >
                ₹200
            </button>


            <button
                type="button"
                class="amount-btn"
                data-amount="500"
            >
                ₹500
            </button>


        </div>


        <!-- Custom Amount -->

        <input
            type="number"
            id="customAmount"
            class="custom-amount"
            placeholder="Or enter custom amount ₹"
            min="10"
            max="50000"
            inputmode="numeric"
        >


        <!-- Payment Button -->

        <button
            id="continuePayment"
            type="button"
            class="pay-button"
        >

            <i class="fa-solid fa-lock"></i>

            <span>
                Continue to Payment
            </span>

            <i class="fa-solid fa-arrow-right"></i>

        </button>


        <!-- Payment Status -->

        <div id="payment-status"></div>


        <!-- Security -->

        <div class="security-note">

            <i class="fa-solid fa-shield-halved"></i>

            Secure payment powered by Razorpay

        </div>


        <!-- Back -->

        <a
            href="index.html"
            class="back-link"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Portfolio

        </a>


    </main>


    <!--
        IMPORTANT:
        Payment JavaScript is kept in a separate file.
        Do NOT add another payment script here.
    -->

    <script src="js/coffee.js"></script>

</body>

</html>
