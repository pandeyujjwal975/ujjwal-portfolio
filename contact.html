<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Ujjwal Pandey">

    <title>Contact — Ujjwal Pandey</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="container">

            <a href="index.html" class="logo">
                Ujjwal
            </a>

            <nav class="navigation">

                <a href="index.html">
                    Home
                </a>

                <a href="learning.html">
                    Learning
                </a>

                <a href="coffee.html">
                    Support
                </a>

                <a href="contact.html" class="active">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         CONTACT SECTION
    ========================== -->

    <main>

        <section class="contact-section">

            <div class="container">

                <div class="contact-wrapper">

                    <!-- LEFT SIDE -->

                    <div class="contact-info">

                        <span class="section-label">
                            GET IN TOUCH
                        </span>

                        <h1>
                            Let's talk.
                        </h1>

                        <p>
                            Have a question, suggestion, collaboration
                            idea, or just want to say hello?
                            Send me a message.
                        </p>


                        <div class="contact-details">

                            <div class="contact-item">

                                <strong>Email</strong>

                                <a href="mailto:pandeyujjwal975@gmail.com">
                                    pandeyujjwal975@gmail.com
                                </a>

                            </div>


                            <div class="contact-item">

                                <strong>GitHub</strong>

                                <a
                                    href="https://github.com/pandeyujjwal975"
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    github.com/pandeyujjwal975
                                </a>

                            </div>

                        </div>

                    </div>


                    <!-- RIGHT SIDE / FORM -->

                    <div class="contact-form-wrapper">

                        <form id="contactForm">

                            <!-- NAME -->

                            <div class="form-group">

                                <label for="name">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Your name"
                                    autocomplete="name"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="form-group">

                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="you@example.com"
                                    autocomplete="email"
                                    required>

                            </div>


                            <!-- SUBJECT -->

                            <div class="form-group">

                                <label for="subject">
                                    Subject
                                </label>

                                <input
                                    type="text"
                                    id="subject"
                                    name="subject"
                                    placeholder="What is this about?"
                                    required>

                            </div>


                            <!-- MESSAGE -->

                            <div class="form-group">

                                <label for="message">
                                    Message
                                </label>

                                <textarea
                                    id="message"
                                    name="message"
                                    rows="7"
                                    placeholder="Write your message..."
                                    required></textarea>

                            </div>


                            <!-- STATUS MESSAGE -->

                            <div
                                id="formStatus"
                                class="form-status"
                                aria-live="polite">
                            </div>


                            <!-- SUBMIT -->

                            <button
                                type="submit"
                                id="submitButton">

                                <span id="buttonText">
                                    Send Message
                                </span>

                                <span
                                    id="buttonLoader"
                                    style="display:none;">
                                    Sending...
                                </span>

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © <span id="year"></span>
                Ujjwal Pandey. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const contactForm =
            document.getElementById("contactForm");

        const formStatus =
            document.getElementById("formStatus");

        const submitButton =
            document.getElementById("submitButton");

        const buttonText =
            document.getElementById("buttonText");

        const buttonLoader =
            document.getElementById("buttonLoader");


        /*
         * Your Render backend
         */

        const API_URL =
            "https://ujjwal-coffee-backend.onrender.com";


        /*
         * Current year
         */

        document.getElementById("year").textContent =
            new Date().getFullYear();


        /*
         * Contact form submission
         */

        contactForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /*
                 * Get form values
                 */

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const subject =
                    document.getElementById("subject").value.trim();

                const message =
                    document.getElementById("message").value.trim();


                /*
                 * Basic validation
                 */

                if (!name || !email || !subject || !message) {

                    showStatus(
                        "Please fill in all fields.",
                        "error"
                    );

                    return;
                }


                /*
                 * Disable button
                 */

                submitButton.disabled = true;

                buttonText.style.display = "none";

                buttonLoader.style.display = "inline";


                showStatus(
                    "Sending your message...",
                    "loading"
                );


                try {

                    /*
                     * Send data to backend
                     */

                    const response =
                        await fetch(
                            `${API_URL}/api/contact`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name,
                                    email,
                                    subject,
                                    message
                                })
                            }
                        );


                    const data =
                        await response.json();


                    /*
                     * Backend error
                     */

                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Something went wrong."
                        );

                    }


                    /*
                     * Success
                     */

                    showStatus(
                        "Message sent successfully! ✓",
                        "success"
                    );


                    /*
                     * Clear form
                     */

                    contactForm.reset();


                } catch (error) {

                    console.error(
                        "Contact form error:",
                        error
                    );


                    showStatus(
                        error.message ||
                        "Unable to send message. Please try again.",
                        "error"
                    );

                } finally {

                    /*
                     * Enable button
                     */

                    submitButton.disabled = false;

                    buttonText.style.display = "inline";

                    buttonLoader.style.display = "none";

                }

            }
        );


        /*
         * Status helper
         */

        function showStatus(message, type) {

            formStatus.textContent = message;

            formStatus.className =
                "form-status " + type;

        }

    </script>

</body>
</html>
