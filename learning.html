<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Ujjwal Pandey Learning Hub"
    >

    <title>Learning Hub | Ujjwal Pandey</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background: #050608;

            color: #f4f7fb;

            font-family: "Inter", sans-serif;

            overflow: hidden;
        }


        /* Background Grid */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -2;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;
        }


        /* Glow */

        body::after {

            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(0,255,156,0.06);

            filter: blur(100px);

            z-index: -1;
        }


        /* Main Card */

        .learning-card {

            width: min(
                100%,
                620px
            );

            padding: 55px 40px;

            text-align: center;

            border: 1px solid
                rgba(255,255,255,0.09);

            border-radius: 20px;

            background:
                rgba(10,13,18,0.88);

            backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.45);
        }


        /* Terminal */

        .terminal {

            margin-bottom: 28px;

            color: #00ff9c;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.75rem;
        }


        .terminal span {

            color: #697282;
        }


        /* Icon */

        .hub-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            display: grid;

            place-items: center;

            border: 1px solid
                rgba(0,255,156,0.25);

            border-radius: 16px;

            color: #00ff9c;

            background:
                rgba(0,255,156,0.05);

            font-size: 1.8rem;

            box-shadow:
                0 0 35px
                rgba(0,255,156,0.08);
        }


        /* Heading */

        h1 {

            margin-bottom: 12px;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size:
                clamp(
                    2rem,
                    7vw,
                    3.3rem
                );

            letter-spacing: -0.05em;
        }


        h1 span {

            color: #00ff9c;
        }


        /* Description */

        .description {

            max-width: 470px;

            margin: 0 auto 30px;

            color: #8b94a3;

            font-size: 0.9rem;

            line-height: 1.8;
        }


        /* User */

        .username {

            margin-bottom: 25px;

            color: #697282;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.68rem;
        }


        .username strong {

            color: #00d9ff;

            font-weight: 500;
        }


        /* Button */

        .drive-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            min-height: 50px;

            padding: 0 22px;

            border-radius: 8px;

            background: #00ff9c;

            color: #020604;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.75rem;

            font-weight: 700;

            text-decoration: none;

            transition: 0.3s ease;

            box-shadow:
                0 12px 30px
                rgba(0,255,156,0.12);
        }


        .drive-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 40px
                rgba(0,255,156,0.22);
        }


        .drive-button i:last-child {

            transition: 0.3s ease;
        }


        .drive-button:hover i:last-child {

            transform:
                translateX(4px);
        }


        /* Back */

        .back-link {

            display: block;

            margin-top: 22px;

            color: #596271;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.62rem;

            text-decoration: none;

            transition: 0.3s ease;
        }


        .back-link:hover {

            color: #00ff9c;
        }


        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .learning-card {

                padding: 42px 22px;

                border-radius: 16px;
            }

            .hub-icon {

                width: 65px;
                height: 65px;

                font-size: 1.5rem;
            }

            .description {

                font-size: 0.82rem;
            }

            .drive-button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <main class="learning-card">


        <div class="terminal">

            <span>$</span>
            access learning_hub

        </div>


        <div class="hub-icon">

            <i class="fa-solid fa-graduation-cap"></i>

        </div>


        <h1>

            Learning
            <span>Hub</span>

        </h1>


        <p class="description">

            Notes, resources, study materials,
            projects and useful learning resources
            collected by Ujjwal.

        </p>


        <div class="username">

            maintained_by:

            <strong>
                ujjwal
            </strong>

        </div>


        <!--
            REPLACE YOUR_GOOGLE_DRIVE_LINK
            WITH YOUR ACTUAL GOOGLE DRIVE FOLDER URL
        -->

        <a
            href="YOUR_GOOGLE_DRIVE_LINK"
            target="_blank"
            rel="noopener noreferrer"
            class="drive-button"
        >

            <i class="fa-brands fa-google-drive"></i>

            Open Learning Hub

            <i class="fa-solid fa-arrow-up-right-from-square"></i>

        </a>


        <a
            href="index.html"
            class="back-link"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Portfolio

        </a>


    </main>


</body>

</html>
